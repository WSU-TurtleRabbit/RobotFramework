# Onboard MV2 motion executor + IMU configuration.
# Every knob has a built-in default (Motion/phx/executor.h) — this file only
# overrides. Values below are the tuned set proven on hardware by the Rust
# robot (phoenix-rf robot.yaml).

imu:
  # Gyro polarity: +1 when the pi3hat gyro reads POSITIVE for a CCW (+w) body
  # rotation — the condition for heading dead-reckoning to cancel drift.
  # VERIFIED +1 on Robot B (its pi3hat is mounted ~180 deg flipped). Re-verify
  # per robot: drive `+w` and check the reported gyro sign matches.
  yaw_rate_sign: 1.0

motion:
  enabled: true
  brake_after_ms: 300      # no fresh MV2 frame -> active smooth stop
  coast_after_ms: 1200     # still nothing -> cut motor output (coast)
  brake_decel_mps2: 3.5    # BRAKE strength ("smoothly but quickly")
  brake_w_decel_radps2: 12.0
  brake_jerk_mps3: 30.0
  pose_gain: 0.35          # server-pose blend per frame (lower = smoother)
  heading_gain: 0.5
  snap_dist_m: 0.35        # bigger pose error -> snap (teleport/occlusion)
  # Per-mode limit profiles (speed m/s, accel m/s^2, jerk m/s^3). An MV2
  # frame can tighten these per-command; it can never loosen them.
  fast_travel:     { max_speed_mps: 2.5,  max_accel_mps2: 2.5, max_jerk_mps3: 15.0 }
  ball_approach:   { max_speed_mps: 0.8,  max_accel_mps2: 1.2, max_jerk_mps3: 8.0 }
  precision_align: { max_speed_mps: 0.35, max_accel_mps2: 1.0, max_jerk_mps3: 6.0 }
  hold_position:   { max_speed_mps: 0.3,  max_accel_mps2: 1.5, max_jerk_mps3: 10.0 }
