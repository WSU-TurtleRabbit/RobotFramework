# Safety supervisor configuration. Defaults in Safety/supervisor.h; this file
# overrides. Values follow the set proven on the Rust robot (phoenix-rf),
# with the envelope kept at this robot's historical limits.

# Operator drive-mode speed envelope, DIRECTION-PRESERVING: the commanded
# body twist is scaled to fit (the translation vector as a unit, so diagonals
# are never bent toward an axis). SAFE mode shapes instead of hard-stopping;
# UNSAFE disables the envelope (fault trips and watchdogs still apply).
envelope:
  safeLinear: 3.5 # m/s   onboard trajectory applies angle-aware limits
  safeAngular: 3.15 # rad/s (historical wLimit)
  cappedLinear: 3.5 # m/s
  cappedAngular: 6.0 # rad/s

# A valid drive command older than this stops the robot (legacy v1 path; the
# MV2 executor has its own richer brake/coast watchdog tiers).
commandTimeoutMs: 250 # milliseconds

# --- Per-motor protective trips (latched; recoverable) ---
# Field-verified against moteus: controller max_current_A=15 A, while normal
# 1 m/s holonomic acceleration reaches ~8 A on wheel 1. Keep a 33% hardware
# margin and the 300 ms sustained-current qualification below.
currentLimit: 10.0 # Amps — sustained per-motor overcurrent

# Sustained over-current window: q-current legitimately spikes past the trip
# level for tens of milliseconds during hard acceleration, so the trip only
# fires after this long of CONSECUTIVE over-limit readings (a real stall),
# not on a transient.
currentGraceMs: 300 # milliseconds

# Consecutive-bad window for the other trips (fault codes, temperature,
# voltage) — one noisy sample must not stop a match.
faultGraceMs: 50 # milliseconds

tripTempC: 70.0 # C — protective stop below the moteus 75 C hard fault
minBusVoltage: 19.0 # V — 6S LiPo under-voltage cutoff (3.17 V/cell)

# Auto-recovery hold-off: a latched trip clears itself after everything has
# been healthy (with hysteresis) for this long while the operator commands
# zero. 0 disables auto-recovery (latch until STOP or restart).
recoveryS: 3.0 # seconds

# moteus per-command hardware watchdog, seconds: if the Pi control loop
# stalls or the process dies, each motor stops itself this long after the
# last command frame — a failsafe independent of any software path.
watchdogTimeout: 0.1 # seconds
