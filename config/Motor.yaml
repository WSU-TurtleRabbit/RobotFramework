motorMap:
  1: 1 # MOTOR ID 1 Mapped to BUS 1
  2: 2 # MOTOR ID 2 Mapped to BUS 2
  3: 3 # MOTOR ID 3 Mapped to BUS 3
  4: 4 # MOTOR ID 4 Mapped to BUS 4

# Meters of body travel per motor output revolution — the ONE drive-scale
# calibration constant (moteus velocity commands are in output rev/s).
# Default = 2*pi*R for the direct-drive 33.5mm omni wheel. CALIBRATE on
# hardware: command a known motor rev count, measure the distance travelled.
# Field-calibrated 2026-07-23 from 21 complete fresh-battery motions by
# integrating the four measured encoder velocities and fitting them to the
# vision displacement. Robust fit 0.21708 m/rev; 90% move-bootstrap interval
# 0.21315..0.22163. This also agrees with the 0.21049 m/rev physical wheel
# circumference once carpet/roller effects are included.
metersPerMotorRev: 0.2171

# The same two-coefficient encoder/vision fit identified the effective
# lateral coefficient as 0.24465 m per raw kinematic revolution. Therefore
# mpr/lateralScale = 0.24465 -> lateralScale = 0.8873. This replaces the
# earlier command/velocity-only estimate, whose sign was reversed by closed
# loop trajectory lag. IK applies this factor and FK its exact reciprocal.
bodyLateralScale: 0.887

# Per-wheel normalization refined from the corrected-IMU, high-load 50 Hz
# commanded-vs-measured fit. The resulting nominal-to-measured wheel products
# are equalized to about 1.008. CAN order is [FR, RR, RL, FL].
motorCommandScale: [1.006, 1.008, 1.004, 1.004]

# Residual sign-specific equalization from the final corrected-IMU 2 m/s
# forward/reverse pair. These multiply the base factors above.
# High-load fixed-heading telemetry on 2026-08-12 isolated the NW yaw bias
# to the dominant opposing pair: motor 4 positive overpowered motor 2
# negative while all four velocity loops tracked. A symmetric 4% pair trim
# supplies counter-yaw before the reactive heading loop has accumulated
# error. The opposite-sign SE diagonal is unaffected by these two entries.
motorCommandScalePositive: [1.001, 0.996, 1.000, 0.962]
motorCommandScaleNegative: [1.001, 1.029, 1.001, 0.999]

# Paired SSL-Vision identification on Robot A, 2026-07-31. Pure + / -
# translation showed systematic yaw despite matched encoder velocities.
# IK adds w = kx*vx + ky*vy; FK removes the same term from wheel odometry.
bodyYawCouplingCompensation: [0.288, 0.361]
# Conservative field-passing west trim. A later full nullspace load-transfer
# candidate was rejected: it still left M1 at 13.77 A and introduced yaw.
# This remains exactly 1.0 at NW/SW diagonals and throughout east.
motorCommandScaleWest: [0.98, 1.00, 1.00, 1.013]
# The first full-speed east return showed an initial clockwise launch bias
# before the delayed heading controller unwound it. Motor 2 has current
# margin; a symmetric 2% M2/M3 pair supplies early counter-yaw only in east.
motorCommandScaleEast: [1.00, 1.02, 0.98, 1.00]

# moteus-level per-command shaping (values proven on the Rust robot):
# the controller bounds each velocity setpoint and its ramp itself, which
# smooths steps between our 100 Hz updates and backstops a runaway command.
# Comment out to use the controller's own defaults.
velocityLimit: 45 # output rev/s
accelLimit: 120 # output rev/s^2
