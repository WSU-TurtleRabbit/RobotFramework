# Review overlay only: low-speed use after simulation, replay and shadow gates.
adaptive:
  enabled: true
rl:
  mode: "bounded"
# Relative paths resolve from the service working directory, which is
# RobotFramework/build (STARTUP.sh launches from there) — hence the "../".
  policy_path: "../config/policies/champion.json"
  residual_limit_fraction: 0.05
  confidence_threshold: 0.65
augmentation_safety:
  correction_limit_fraction: 0.15
  correction_jerk_linear_mps3: 10.0
  correction_jerk_angular_radps3: 30.0
motion_logging:
  enabled: true
  rate_hz: 100.0
