<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="480" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2328">MatchCtrl — 32 bytes on the wire (server → robot, UDP 50514)</text>
  <text x="24" y="56" font-size="12" fill="#57606a">6-byte header + 26-byte body, little-endian. Byte offsets above the grid; colors group the fields.</text>

  <!-- offset numbers -->
  <g font-size="9" fill="#57606a" font-family="ui-monospace, Consolas, monospace">
    <text x="55" y="92">0</text>
    <text x="111" y="92">2</text>
    <text x="139" y="92">3</text>
    <text x="167" y="92">4</text>
    <text x="223" y="92">6</text>
    <text x="279" y="92">8</text>
    <text x="333" y="92">10</text>
    <text x="391" y="92">12</text>
    <text x="419" y="92">13</text>
    <text x="447" y="92">14</text>
    <text x="475" y="92">15</text>
    <text x="503" y="92">16</text>
    <text x="923" y="92">31</text>
  </g>

  <!-- byte cells -->
  <g stroke="#d0d7de">
    <rect x="52" y="100" width="56" height="34" fill="#eaeef2"/>
    <rect x="108" y="100" width="28" height="34" fill="#eaeef2"/>
    <rect x="136" y="100" width="28" height="34" fill="#eaeef2"/>
    <rect x="164" y="100" width="56" height="34" fill="#eaeef2"/>
    <rect x="220" y="100" width="56" height="34" fill="#ddf4ff"/>
    <rect x="276" y="100" width="56" height="34" fill="#ddf4ff"/>
    <rect x="332" y="100" width="56" height="34" fill="#ddf4ff"/>
    <rect x="388" y="100" width="28" height="34" fill="#dafbe1"/>
    <rect x="416" y="100" width="28" height="34" fill="#dafbe1"/>
    <rect x="444" y="100" width="28" height="34" fill="#eaeef2"/>
    <rect x="472" y="100" width="28" height="34" fill="#fbefff"/>
    <rect x="500" y="100" width="448" height="34" fill="#fff1e5"/>
  </g>
  <g font-size="10" fill="#1f2328" text-anchor="middle">
    <text x="80" y="121">PX</text>
    <text x="122" y="121">05</text>
    <text x="150" y="121">id</text>
    <text x="192" y="121">seq</text>
    <text x="248" y="121">x</text>
    <text x="304" y="121">y</text>
    <text x="360" y="121">θ</text>
    <text x="402" y="121" font-size="9">dly</text>
    <text x="430" y="121" font-size="9">cam</text>
    <text x="458" y="121" font-size="9">flg</text>
    <text x="486" y="121" font-size="9">skill</text>
    <text x="724" y="121" font-size="11">skillData — 16 bytes</text>
  </g>

  <!-- brackets row A -->
  <g stroke="#57606a" fill="none">
    <path d="M52,146 L52,152 L220,152 L220,146"/>
    <path d="M220,146 L220,152 L388,152 L388,146"/>
    <path d="M500,146 L500,152 L948,152 L948,146"/>
  </g>
  <text x="136" y="168" font-size="10" fill="#57606a" text-anchor="middle">header · PX 05 id seq</text>
  <text x="304" y="168" font-size="10" font-weight="700" fill="#0969da" text-anchor="middle">vision pose ×3</text>
  <text x="724" y="168" font-size="10" font-weight="700" fill="#bc4c00" text-anchor="middle">skill payload + KickerDribbler field</text>

  <!-- brackets row B -->
  <path d="M388,180 L388,186 L500,186 L500,180" stroke="#57606a" fill="none"/>
  <text x="444" y="202" font-size="10" fill="#57606a" text-anchor="middle">posDelay Q6.2 ms · camId · flags · skillId</text>

  <!-- legend cards -->
  <rect x="52" y="230" width="436" height="104" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="66" y="246" width="14" height="14" fill="#ddf4ff" stroke="#0969da"/>
  <text x="88" y="258" font-size="12" font-weight="700" fill="#1f2328">vision pose (6 bytes)</text>
  <text x="68" y="278" font-size="10" fill="#57606a">freshest camera fix: x, y in mm · θ in mrad</text>
  <text x="68" y="296" font-size="10" fill="#57606a">any axis = 0x7FFF → no fresh vision — dead-reckon</text>
  <text x="68" y="314" font-size="10" fill="#57606a">inserted posDelay + 20 ms into the past ⇒ no clock sync</text>

  <rect x="512" y="230" width="436" height="104" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="526" y="246" width="14" height="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="548" y="258" font-size="12" font-weight="700" fill="#1f2328">posDelay · camId · flags · skillId</text>
  <text x="528" y="278" font-size="10" fill="#57606a">posDelay: measured pose age, Q6.2 ms (raw × 250 = µs)</text>
  <text x="528" y="296" font-size="10" fill="#57606a">skillId: EMERGENCY 0 · WHEEL_VEL 1 · LOCAL_VEL 2</text>
  <text x="528" y="314" font-size="10" fill="#57606a">GLOBAL_VEL 3 · GLOBAL_POS 4 · SINE 6 · FAST_POS 7</text>

  <rect x="52" y="344" width="436" height="104" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="66" y="360" width="14" height="14" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="88" y="372" font-size="12" font-weight="700" fill="#1f2328">skillData (16 bytes)</text>
  <text x="68" y="392" font-size="10" fill="#57606a">per-skill payload: target pose / velocity + limits</text>
  <text x="68" y="410" font-size="10" fill="#57606a">u8 limits scale raw/255 × pinned max (5 m/s · 10 m/s²)</text>
  <text x="68" y="428" font-size="10" fill="#57606a">ends with the 24-bit KickerDribbler (kick + dribble)</text>

  <rect x="512" y="344" width="436" height="104" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="526" y="360" width="14" height="14" fill="#eaeef2" stroke="#57606a"/>
  <text x="548" y="372" font-size="12" font-weight="700" fill="#1f2328">header (6 bytes)</text>
  <text x="528" y="392" font-size="10" fill="#57606a">magic PX · command 0x05 · robot id · seq u16 LE</text>
  <text x="528" y="410" font-size="10" fill="#57606a">seq drops reordered frames · id must match config</text>
  <text x="528" y="428" font-size="10" fill="#57606a">byte-for-byte mirror of phoenix-server's wire.py</text>
</svg>
