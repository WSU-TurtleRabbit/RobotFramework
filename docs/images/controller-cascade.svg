<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2328">The Panthera cascade — Motion/controller</text>
  <text x="24" y="56" font-size="12" fill="#57606a">Feedforward from the trajectory + proportional corrections from the estimate, every tick.</text>

  <!-- container -->
  <rect x="30" y="76" width="920" height="352" rx="10" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="46" y="100" font-size="12" font-weight="700" fill="#8250df">runs at 250 Hz inside match_bridge</text>

  <!-- trajectory -->
  <rect x="60" y="130" width="180" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="72" y="152" font-size="12" font-weight="700" fill="#1f2328">trajectory sample</text>
  <text x="72" y="170" font-size="10" fill="#57606a">v_ref · a_ref · pose_ref</text>
  <text x="72" y="186" font-size="10" fill="#57606a">(smooth by construction)</text>

  <!-- feedforward arrow + sum -->
  <line x1="240" y1="165" x2="318" y2="165" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="280" y="150" font-size="10" fill="#1a7f37" text-anchor="middle">v_ff = v_ref + a_ref·lead</text>
  <circle cx="340" cy="165" r="18" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="340" y="170" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Σ</text>

  <!-- P position block -->
  <rect x="250" y="280" width="180" height="60" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="340" y="302" font-size="11" font-weight="700" fill="#0969da" text-anchor="middle">P · clamp(pose error)</text>
  <text x="340" y="320" font-size="10" fill="#0969da" text-anchor="middle">pose_ref − pose_est (global)</text>
  <line x1="340" y1="280" x2="340" y2="187" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- estimate block -->
  <rect x="60" y="280" width="160" height="60" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="140" y="302" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">estimate</text>
  <text x="140" y="318" font-size="10" fill="#1a7f37" text-anchor="middle">pose θ̂ · gyro ω</text>
  <text x="140" y="332" font-size="9" fill="#1a7f37" text-anchor="middle">from Motion/estimator</text>
  <line x1="220" y1="310" x2="248" y2="310" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- theta-hat path to rotate -->
  <path d="M140,280 L140,240 L462,240 L462,202" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="232" font-size="10" fill="#1a7f37" text-anchor="middle">θ̂</text>

  <!-- gyro path to heading -->
  <path d="M110,340 L110,368 L500,368 L500,344" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="362" font-size="10" fill="#1a7f37" text-anchor="middle">gyro ω</text>

  <!-- rotate -->
  <rect x="450" y="130" width="170" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="535" y="152" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">rotate by θ̂</text>
  <text x="535" y="170" font-size="10" fill="#57606a" text-anchor="middle">world → body frame</text>
  <text x="535" y="186" font-size="10" fill="#57606a" text-anchor="middle">ω joins here</text>
  <line x1="358" y1="165" x2="448" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="150" font-size="10" fill="#57606a" text-anchor="middle">v_world</text>

  <!-- heading block -->
  <rect x="450" y="280" width="170" height="60" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="535" y="300" font-size="10" font-weight="700" fill="#0969da" text-anchor="middle">heading: P(θ_ref − θ̂)</text>
  <text x="535" y="318" font-size="10" fill="#0969da" text-anchor="middle">+ P(ω_ref − gyro) → ω_cmd</text>
  <line x1="535" y1="280" x2="535" y2="204" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- inverse kinematics -->
  <rect x="680" y="130" width="150" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="755" y="152" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">inverse kinematics</text>
  <text x="755" y="170" font-size="10" fill="#57606a" text-anchor="middle">Math/kinematics</text>
  <text x="755" y="186" font-size="10" fill="#57606a" text-anchor="middle">→ 4 wheel rev/s</text>
  <line x1="620" y1="165" x2="678" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="150" font-size="10" fill="#57606a" text-anchor="middle">body twist</text>

  <!-- output guard -->
  <rect x="680" y="280" width="150" height="60" rx="6" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="755" y="300" font-size="10" font-weight="700" fill="#bc4c00" text-anchor="middle">slew 120 rev/s²</text>
  <text x="755" y="318" font-size="10" fill="#bc4c00" text-anchor="middle">sat 45 rev/s · NaN guard</text>
  <line x1="755" y1="200" x2="755" y2="276" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- to moteus -->
  <line x1="830" y1="310" x2="942" y2="310" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="886" y="294" font-size="10" font-weight="700" fill="#1f2328" text-anchor="middle">to moteus CAN</text>

  <!-- bottom note -->
  <text x="46" y="396" font-size="10" fill="#57606a">velocity skills shape through an accel+jerk S-curve instead · EMERGENCY ramps at 8 m/s²</text>
  <text x="46" y="412" font-size="10" fill="#57606a">model feedforward (coulomb + viscous + mass → per-wheel torque) implemented, off until identified</text>
</svg>
