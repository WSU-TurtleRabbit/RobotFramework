<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">Where everything lives</text>
  <text x="24" y="58" font-size="12" fill="#57606a">RobotFramework.cpp is thin glue — sockets, CAN, serial, supervisor. The real work is in small, host-tested modules.</text>

  <!-- connector arrows -->
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="490" y1="250" x2="490" y2="238" marker-end="url(#arrow)"/>
    <line x1="490" y1="404" x2="490" y2="418" marker-end="url(#arrow)"/>
    <line x1="338" y1="327" x2="324" y2="327" marker-end="url(#arrow)"/>
    <line x1="642" y1="327" x2="656" y2="327" marker-end="url(#arrow)"/>
    <line x1="345" y1="258" x2="317" y2="230" marker-end="url(#arrow)"/>
    <line x1="635" y1="258" x2="663" y2="230" marker-end="url(#arrow)"/>
    <line x1="345" y1="396" x2="317" y2="424" marker-end="url(#arrow)"/>
    <line x1="635" y1="396" x2="663" y2="424" marker-end="url(#arrow)"/>
  </g>

  <!-- top-left: Networks -->
  <rect x="20" y="84" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="112" font-size="13" font-weight="700" fill="#0969da">Networks/ — the wire</text>
  <text x="36" y="136" font-size="11" fill="#57606a">UDP sockets — UDP.{h,cpp}</text>
  <text x="36" y="154" font-size="11" fill="#57606a">MatchCtrl binary codec — matchctrl.{h,cpp}</text>
  <text x="36" y="172" font-size="11" fill="#57606a">legacy text decode — decode.{h,cpp}</text>
  <text x="36" y="190" font-size="11" fill="#57606a">strict: a packet decodes fully or not at all</text>

  <!-- top-middle: Motion -->
  <rect x="340" y="84" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="356" y="112" font-size="13" font-weight="700" fill="#8250df">Motion/ — the brain</text>
  <text x="356" y="136" font-size="11" fill="#57606a">skills · estimator · trajectory · controller</text>
  <text x="356" y="154" font-size="11" fill="#57606a">actuators · match_bridge (orchestrates a tick)</text>
  <text x="356" y="172" font-size="11" fill="#57606a">phx/ — planner math: bang-bang 1D/2D, S-curve</text>
  <text x="356" y="190" font-size="11" fill="#57606a">match_config_yaml — loads config/Motion.yaml</text>

  <!-- top-right: Telemetry -->
  <rect x="660" y="84" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="676" y="112" font-size="13" font-weight="700" fill="#1a7f37">Telemetry/ — muscle + status</text>
  <text x="676" y="136" font-size="11" fill="#57606a">Telemetry — moteus CAN cycle: velocity mode,</text>
  <text x="676" y="154" font-size="11" fill="#57606a">limits, 0.1 s watchdog, IMU sample</text>
  <text x="676" y="172" font-size="11" fill="#57606a">match_feedback — 50 Hz status to the server</text>
  <text x="676" y="190" font-size="11" fill="#57606a">motor_formats.h — CAN frame layouts</text>

  <!-- middle-left: BallDetection -->
  <rect x="20" y="252" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="280" font-size="13" font-weight="700" fill="#bc4c00">BallDetection/ — the eyes</text>
  <text x="36" y="304" font-size="11" fill="#57606a">OpenCV ball camera — detect_ball.{h,cpp}</text>
  <text x="36" y="322" font-size="11" fill="#57606a">a big + centered + confident + fresh detection</text>
  <text x="36" y="340" font-size="11" fill="#57606a">= ball at the mouth: the break-beam stand-in</text>
  <text x="36" y="358" font-size="11" fill="#57606a">drives ARM kicks + the feedback barrier bit</text>

  <!-- center: superloop -->
  <rect x="340" y="252" width="300" height="150" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="490" y="296" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">RobotFramework.cpp</text>
  <text x="490" y="318" font-size="11" fill="#0969da" text-anchor="middle">the superloop — thin glue</text>
  <text x="490" y="336" font-size="11" fill="#0969da" text-anchor="middle">sockets · CAN · serial · supervisor</text>
  <text x="490" y="354" font-size="11" fill="#0969da" text-anchor="middle">runs the 250 Hz tick</text>

  <!-- middle-right: Safety -->
  <rect x="660" y="252" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="676" y="280" font-size="13" font-weight="700" fill="#cf222e">Safety/ — the guard</text>
  <text x="676" y="304" font-size="11" fill="#57606a">supervisor.{h,cpp} — per-motor trips:</text>
  <text x="676" y="322" font-size="11" fill="#57606a">over-current · over-temperature</text>
  <text x="676" y="340" font-size="11" fill="#57606a">under-voltage · fault — recoverable,</text>
  <text x="676" y="358" font-size="11" fill="#57606a">re-arms when the condition clears</text>

  <!-- bottom-left: Math + Logger -->
  <rect x="20" y="420" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="448" font-size="13" font-weight="700" fill="#57606a">Math/ · Logger/ — support</text>
  <text x="36" y="472" font-size="11" fill="#57606a">kinematics — body twist ↔ wheel speeds</text>
  <text x="36" y="490" font-size="11" fill="#57606a">wheel_math — meters-per-rev scaling</text>
  <text x="36" y="508" font-size="11" fill="#57606a">Logger — structured runtime logs</text>

  <!-- bottom-middle: Arduino -->
  <rect x="340" y="420" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="356" y="448" font-size="13" font-weight="700" fill="#9a6700">Arduino/ — kicker board</text>
  <text x="356" y="472" font-size="11" fill="#57606a">solenoid kick pulse (ms) · dribbler ESC (µs)</text>
  <text x="356" y="490" font-size="11" fill="#57606a">serial 115200 8N1 — k/ms · d/µs · S stop</text>
  <text x="356" y="508" font-size="11" fill="#57606a">enforces a 5 s recharge gap by itself</text>

  <!-- bottom-right: config + tests -->
  <rect x="660" y="420" width="300" height="150" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="676" y="448" font-size="13" font-weight="700" fill="#1a7f37">config/ · tests/ — knobs + proof</text>
  <text x="676" y="472" font-size="11" fill="#57606a">Motion / Motor / Safety / Main / Network.yaml</text>
  <text x="676" y="490" font-size="11" fill="#57606a">every tuning knob, no recompile needed</text>
  <text x="676" y="508" font-size="11" fill="#57606a">tests/host — Pi-free unit tests + a full</text>
  <text x="676" y="526" font-size="11" fill="#57606a">simulated-plant run of the whole cascade</text>
</svg>
