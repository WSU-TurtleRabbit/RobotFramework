<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">System overview — the server owns strategy, the robot owns all fast motion</text>
  <text x="24" y="58" font-size="12" fill="#57606a">TIGERs Mannheim MatchCtrl split — one binary frame per robot per camera tick; everything fast runs onboard at 250 Hz.</text>

  <!-- robot boundary (drawn first so arrows cross its edge) -->
  <rect x="446" y="84" width="518" height="392" rx="10" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="462" y="108" font-size="13" font-weight="700" fill="#8250df">the robot — this repo</text>

  <!-- vision -->
  <rect x="36" y="92" width="190" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="51" y="116" font-size="13" font-weight="700" fill="#1f2328">SSL-Vision cameras</text>
  <text x="51" y="138" font-size="11" fill="#57606a">whole-field tracking, 60+ Hz</text>

  <line x1="141" y1="156" x2="141" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="153" y="180" font-size="10" fill="#57606a">raw detections</text>

  <!-- server -->
  <rect x="36" y="196" width="190" height="116" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="51" y="218" font-size="13" font-weight="700" fill="#1f2328">phoenix-server</text>
  <text x="51" y="238" font-size="11" fill="#57606a">AI / strategy picks a skill</text>
  <text x="51" y="256" font-size="11" fill="#57606a">encodes MatchCtrl frames</text>
  <text x="51" y="274" font-size="11" fill="#57606a">mirrors the trajectory planner</text>
  <text x="51" y="292" font-size="11" fill="#57606a">measures each pose's age</text>

  <!-- network arrows -->
  <line x1="226" y1="238" x2="444" y2="238" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="336" y="206" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">MatchCtrl — UDP 50514</text>
  <text x="336" y="222" font-size="10" fill="#57606a" text-anchor="middle">pose + age + skill, each camera tick</text>

  <line x1="446" y1="306" x2="228" y2="306" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="336" y="272" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">MatchFeedback — UDP 50513 · 50 Hz</text>
  <text x="336" y="290" font-size="10" fill="#57606a" text-anchor="middle">robot state + health back to the AI</text>

  <text x="336" y="348" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">Wi-Fi — no clock sync needed:</text>
  <text x="336" y="362" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">posDelay carries the pose age</text>

  <!-- legacy bench fallback -->
  <rect x="36" y="392" width="190" height="70" rx="6" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="51" y="414" font-size="12" font-weight="700" fill="#57606a">bench fallback</text>
  <text x="51" y="432" font-size="10" fill="#57606a">legacy text UDP — STOP · PING ·</text>
  <text x="51" y="447" font-size="10" fill="#57606a">v1 7-field velocity command</text>
  <line x1="226" y1="427" x2="444" y2="427" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Pi box -->
  <rect x="468" y="124" width="474" height="142" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="482" y="148" font-size="13" font-weight="700" fill="#1f2328">Raspberry Pi — RobotFramework daemon</text>
  <text x="482" y="168" font-size="11" fill="#57606a">250 Hz control loop (4 ms) — motion never waits on Wi-Fi</text>

  <!-- module chips row 1 -->
  <rect x="482" y="182" width="116" height="26" rx="13" fill="#ddf4ff"/>
  <text x="540" y="199" font-size="11" fill="#0969da" text-anchor="middle">matchctrl decode</text>
  <rect x="606" y="182" width="90" height="26" rx="13" fill="#ddf4ff"/>
  <text x="651" y="199" font-size="11" fill="#0969da" text-anchor="middle">match_bridge</text>
  <rect x="704" y="182" width="54" height="26" rx="13" fill="#ddf4ff"/>
  <text x="731" y="199" font-size="11" fill="#0969da" text-anchor="middle">skills</text>
  <rect x="766" y="182" width="72" height="26" rx="13" fill="#ddf4ff"/>
  <text x="802" y="199" font-size="11" fill="#0969da" text-anchor="middle">estimator</text>

  <!-- module chips row 2 -->
  <rect x="482" y="216" width="78" height="26" rx="13" fill="#ddf4ff"/>
  <text x="521" y="233" font-size="11" fill="#0969da" text-anchor="middle">trajectory</text>
  <rect x="568" y="216" width="78" height="26" rx="13" fill="#ddf4ff"/>
  <text x="607" y="233" font-size="11" fill="#0969da" text-anchor="middle">controller</text>
  <rect x="654" y="216" width="72" height="26" rx="13" fill="#ddf4ff"/>
  <text x="690" y="233" font-size="11" fill="#0969da" text-anchor="middle">actuators</text>
  <rect x="734" y="216" width="72" height="26" rx="13" fill="#ddf4ff"/>
  <text x="770" y="233" font-size="11" fill="#0969da" text-anchor="middle">Telemetry</text>
  <rect x="814" y="216" width="78" height="26" rx="13" fill="#ddf4ff"/>
  <text x="853" y="233" font-size="11" fill="#0969da" text-anchor="middle">supervisor</text>

  <!-- hardware links -->
  <line x1="524" y1="296" x2="524" y2="268" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="268" x2="645" y2="296" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="766" y1="268" x2="766" y2="294" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="887" y1="296" x2="887" y2="268" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- hardware boxes -->
  <rect x="468" y="296" width="112" height="84" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="524" y="318" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">pi3hat IMU</text>
  <text x="524" y="338" font-size="10" fill="#57606a" text-anchor="middle">gyro yaw rate</text>
  <text x="524" y="354" font-size="10" fill="#57606a" text-anchor="middle">NaN → odometry yaw</text>

  <rect x="589" y="296" width="112" height="84" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="645" y="318" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">4× moteus BLDC</text>
  <text x="645" y="338" font-size="10" fill="#57606a" text-anchor="middle">velocity mode CAN</text>
  <text x="645" y="354" font-size="10" fill="#57606a" text-anchor="middle">0.1 s watchdog</text>

  <rect x="710" y="296" width="112" height="84" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="766" y="318" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">Arduino</text>
  <text x="766" y="338" font-size="10" fill="#57606a" text-anchor="middle">kicker + dribbler</text>
  <text x="766" y="354" font-size="10" fill="#57606a" text-anchor="middle">serial · 5 s kick gap</text>

  <rect x="831" y="296" width="112" height="84" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="887" y="318" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">ball camera</text>
  <text x="887" y="338" font-size="10" fill="#57606a" text-anchor="middle">contact sensor</text>
  <text x="887" y="354" font-size="10" fill="#57606a" text-anchor="middle">barrier bit source</text>

  <!-- footer inside robot -->
  <text x="468" y="420" font-size="11" fill="#57606a">Also onboard: delayed-vision fusion, per-tick trajectory regeneration,</text>
  <text x="468" y="438" font-size="11" fill="#57606a">Panthera control cascade, kicker policy, six safety tiers — next pages.</text>
</svg>
