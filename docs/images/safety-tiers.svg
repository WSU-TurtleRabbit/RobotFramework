<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="580" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">The safety net — six independent ways the robot stops</text>
  <text x="24" y="58" font-size="12" fill="#57606a">All tiers are armed all the time, from the server down to the silicon — deeper means closer to the hardware.</text>

  <!-- tier 1 -->
  <rect x="60" y="84" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="84" width="6" height="64" fill="#cf222e"/>
  <text x="84" y="110" font-size="13" font-weight="700" fill="#1f2328">Server EMERGENCY skill</text>
  <text x="84" y="130" font-size="11" fill="#57606a">strategy's own stop — controlled ramp to zero at 8 m/s², then motors off</text>
  <rect x="620" y="105" width="64" height="22" rx="11" fill="#ffebe9" stroke="#cf222e"/>
  <text x="652" y="120" font-size="10" font-weight="700" fill="#cf222e" text-anchor="middle">server</text>
  <line x1="380" y1="148" x2="380" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tier 2 -->
  <rect x="60" y="164" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="164" width="6" height="64" fill="#bc4c00"/>
  <text x="84" y="190" font-size="13" font-weight="700" fill="#1f2328">Command watchdog</text>
  <text x="84" y="210" font-size="11" fill="#57606a">no accepted MatchCtrl for 1 s ⇒ the robot runs EMERGENCY by itself</text>
  <rect x="620" y="185" width="64" height="22" rx="11" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="652" y="200" font-size="10" font-weight="700" fill="#bc4c00" text-anchor="middle">1 s</text>
  <line x1="380" y1="228" x2="380" y2="240" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tier 3 -->
  <rect x="60" y="244" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="244" width="6" height="64" fill="#9a6700"/>
  <text x="84" y="270" font-size="13" font-weight="700" fill="#1f2328">Vision timeout</text>
  <text x="84" y="290" font-size="11" fill="#57606a">dead reckoning on encoders + gyro; the first fix back snaps the estimate</text>
  <rect x="620" y="265" width="64" height="22" rx="11" fill="#fff8c5" stroke="#9a6700"/>
  <text x="652" y="280" font-size="10" font-weight="700" fill="#9a6700" text-anchor="middle">1 s</text>
  <line x1="380" y1="308" x2="380" y2="320" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tier 4 -->
  <rect x="60" y="324" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="324" width="6" height="64" fill="#1a7f37"/>
  <text x="84" y="350" font-size="13" font-weight="700" fill="#1f2328">First-fix gate</text>
  <text x="84" y="370" font-size="11" fill="#57606a">no vision fix yet ⇒ no motion at all — never drives blind at start-up</text>
  <rect x="620" y="345" width="64" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="652" y="360" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">start-up</text>
  <line x1="380" y1="388" x2="380" y2="400" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tier 5 -->
  <rect x="60" y="404" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="404" width="6" height="64" fill="#0969da"/>
  <text x="84" y="430" font-size="13" font-weight="700" fill="#1f2328">moteus command watchdog</text>
  <text x="84" y="450" font-size="11" fill="#57606a">if CAN velocity commands stop arriving, the controllers stop the motors</text>
  <rect x="620" y="425" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#0969da"/>
  <text x="652" y="440" font-size="10" font-weight="700" fill="#0969da" text-anchor="middle">100 ms</text>
  <line x1="380" y1="468" x2="380" y2="480" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tier 6 -->
  <rect x="60" y="484" width="640" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="484" width="6" height="64" fill="#8250df"/>
  <text x="84" y="510" font-size="13" font-weight="700" fill="#1f2328">Supervisor trips — Safety/supervisor</text>
  <text x="84" y="530" font-size="11" fill="#57606a">over-current · over-temp · under-voltage · fault — recoverable, re-arms when clear</text>
  <rect x="620" y="505" width="64" height="22" rx="11" fill="#fbefff" stroke="#8250df"/>
  <text x="652" y="520" font-size="10" font-weight="700" fill="#8250df" text-anchor="middle">on fault</text>
</svg>
